name: VoxKage Web Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # Trigger every 10 minutes
  workflow_dispatch:          # Allow manual triggers

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Ping Web Space Endpoint
        run: |
          echo "💓 Sending heartbeat query to VoxKage Web Hugging Face Space..."
          
          SPACE_URL="${{ secrets.VOXKAGE_WEB_SPACE_URL }}"
          # Fallback to general VOXKAGE_SPACE_URL if web-specific is not set
          if [ -z "$SPACE_URL" ]; then
            SPACE_URL="${{ secrets.VOXKAGE_SPACE_URL }}"
          fi
          # Fallback to default endpoint if secrets are not configured in GitHub
          if [ -z "$SPACE_URL" ]; then
            SPACE_URL="https://shinayush-voxkage-web-backend.hf.space"
          fi
          
          if [ -z "$SPACE_URL" ]; then
            echo "⚠️ Warning: SPACE_URL is still empty."
          else
            success=false
            for i in {1..18}; do
              echo "Space Heartbeat attempt $i..."
              # Bypassing curl failure rules on initial connection to trigger wakeup,
              # then check if we get a valid 200 health response.
              if curl -sf --connect-timeout 10 --max-time 15 "$SPACE_URL/health" > /dev/null; then
                success=true
                break
              fi
              echo "⚠️ Space Heartbeat attempt $i failed. Retrying in 10 seconds..."
              sleep 10
            done
            
            if [ "$success" = true ]; then
              echo "✅ Web Space Heartbeat acknowledged."
            else
              echo "❌ Web Space failed to respond."
              exit 1
            fi
          fi

      - name: Ping Web Dataset Endpoint
        run: |
          echo "💓 Sending heartbeat query to VoxKage Web Hugging Face Dataset..."
          
          DATASET_URL="${{ secrets.VOXKAGE_WEB_DATASET_URL }}"
          if [ -z "$DATASET_URL" ]; then
            echo "⚠️ Warning: VOXKAGE_WEB_DATASET_URL secret is not configured in GitHub Settings. Skipping Dataset ping."
          else
            success=false
            for i in {1..18}; do
              echo "Dataset Heartbeat attempt $i..."
              if curl -sf --connect-timeout 10 --max-time 15 "$DATASET_URL" > /dev/null; then
                success=true
                break
              fi
              echo "⚠️ Dataset Heartbeat attempt $i failed. Retrying in 10 seconds..."
              sleep 10
            done
            
            if [ "$success" = true ]; then
              echo "✅ Web Dataset Heartbeat acknowledged."
            else
              echo "❌ Web Dataset failed to respond."
              exit 1
            fi
          fi

      - name: Keep GitHub Actions alive (prevent 60-day auto-disable)
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
          time_elapsed: 50
