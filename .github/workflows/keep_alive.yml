name: VoxKage Web Keep Alive

on:
  schedule:
    - cron: "0 0,12 * * *"   # Trigger every 12 hours (60 runs/mo = 60 min/mo, consuming only 3% of GitHub Actions free quota)
  workflow_dispatch:          # Allow manual triggers from GitHub Actions UI

jobs:
  keep-alive:
    name: Heartbeat & Inactivity Prevention
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 1. Hugging Face Space Heartbeat (Prevents 48h sleep)
      - name: Ping Hugging Face Space Endpoint
        run: |
          echo "💓 Sending heartbeat to VoxKage Web Hugging Face Space..."
          
          SPACE_URL="${{ secrets.VOXKAGE_WEB_SPACE_URL }}"
          if [ -z "$SPACE_URL" ]; then
            SPACE_URL="${{ secrets.VOXKAGE_SPACE_URL }}"
          fi
          if [ -z "$SPACE_URL" ]; then
            SPACE_URL="https://shinayush-voxkage-web-backend.hf.space"
          fi
          
          echo "Target URL: $SPACE_URL/health"
          success=false
          for i in {1..3}; do
            echo "Attempt $i..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "$SPACE_URL/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Hugging Face Space is active (HTTP $HTTP_CODE)."
              success=true
              break
            else
              echo "⚠️ Space returned HTTP $HTTP_CODE. Retrying in 5s..."
              sleep 5
            fi
          done
          
          if [ "$success" = false ]; then
            echo "⚠️ Notice: Space health check did not return 200/204/301, but HTTP connection was initiated to awaken container."
          fi

      # 2. Supabase Heartbeat (Prevents 7-day database pause)
      - name: Ping Supabase Database Endpoint
        run: |
          echo "💓 Sending query to Supabase to reset 7-day inactivity timer..."
          
          SUPA_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPA_URL" ]; then
            SUPA_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          fi
          
          SUPA_KEY="${{ secrets.SUPABASE_KEY }}"
          if [ -z "$SUPA_KEY" ]; then
            SUPA_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          fi
          
          if [ -n "$SUPA_URL" ] && [ -n "$SUPA_KEY" ]; then
            REST_ENDPOINT="${SUPA_URL%/}/rest/v1/"
            echo "Querying Supabase REST endpoint..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPA_KEY" \
              -H "Authorization: Bearer $SUPA_KEY" \
              --connect-timeout 10 \
              --max-time 15 \
              "$REST_ENDPOINT" || echo "000")
            echo "✅ Supabase responded with HTTP $HTTP_CODE (inactivity timer reset)."
          else
            echo "ℹ️ Supabase secrets not configured in GitHub repository settings. Skipping direct REST ping."
          fi

      # 3. Hugging Face Dataset Heartbeat (if configured)
      - name: Ping Hugging Face Dataset Endpoint
        run: |
          DATASET_URL="${{ secrets.VOXKAGE_WEB_DATASET_URL }}"
          if [ -n "$DATASET_URL" ]; then
            echo "💓 Sending heartbeat query to Hugging Face Dataset..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "$DATASET_URL" || echo "000")
            echo "✅ Dataset endpoint responded with HTTP $HTTP_CODE."
          else
            echo "ℹ️ VOXKAGE_WEB_DATASET_URL secret is not configured. Skipping dataset ping."
          fi

      # 4. GitHub Actions 60-Day Anti-Disable Keep-Alive
      - name: Prevent GitHub Actions 60-Day Schedule Deactivation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          last_commit_time=$(git log -1 --format=%ct)
          current_time=$(date +%s)
          days_diff=$(( (current_time - last_commit_time) / 86400 ))
          
          echo "Days since last commit: $days_diff"
          if [ $days_diff -ge 45 ]; then
            echo "Last commit was $days_diff days ago (>= 45 days). Refreshing repository activity..."
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive_timestamp
            git add .github/keepalive_timestamp
            git commit -m "chore(keep-alive): refresh repository activity timestamp [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Keep-alive commit pushed successfully."
          else
            echo "✅ Repository active ($days_diff days since last commit, threshold is 45 days)."
          fi
